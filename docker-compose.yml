services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT}:${PORT}"
    env_file:
      - path: .env
      - path: .env.local
        required: false
    environment:
      HOST: 0.0.0.0
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads-products:/app/public/images/products
      - uploads-events:/app/public/images/events
      - uploads-newsletter:/app/public/images/newsletter
      - uploads-background:/app/public/images/background

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  uploads-products:
  uploads-events:
  uploads-newsletter:
  uploads-background:
  mongo-data:
